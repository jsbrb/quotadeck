<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuotaDeck</title>
    <style>
      /* Second-taskbar strip (WU-G): dark, fixed height, no window chrome.
         The window is ONLY the bar in quotas mode; KEYS opens as a taller
         docked window with the same dark canvas. */
      :root {
        --bar-bg: #1f1f1f;
        --bar-sep: #383838;
        --bar-text: #eaeaea;
        --bar-muted: #9aa0a6;
        --warn: #ef4444;
        --paper: #f5f1e8;
        --ink: #0f172a;
        --slate: #e2e8f0;
        --shadow-offset: 4px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bar-bg);
        color: var(--bar-text);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        min-height: 100vh;
        user-select: none;
        overflow: hidden;
      }
      #bar {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: stretch;
        height: 68px;
      }
      .seg {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        padding: 0 16px;
        border-left: 1px solid var(--bar-sep);
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .seg:first-child {
        border-left: none;
      }
      .seg-top {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .seg-name {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .seg-pct {
        font-size: 14px;
        font-weight: 700;
      }
      .seg-reset {
        font-size: 10px;
        color: var(--bar-muted);
        letter-spacing: 0.06em;
      }
      .seg-err {
        font-size: 11px;
        color: var(--warn);
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      /* KEYS mode: same dark canvas, light instrument panels. */
      #keys {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 14px;
        align-items: start;
        padding: 14px;
      }
      #keys.hidden,
      #bar.hidden {
        display: none;
      }
      .card {
        border: 2px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
        box-shadow: var(--shadow-offset) var(--shadow-offset) 0 #000000;
        padding: 10px 12px;
      }
      .provider-name {
        margin: 0 0 8px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .field {
        display: block;
        margin-bottom: 8px;
      }
      .field span {
        display: block;
        font-size: 9px;
        letter-spacing: 0.08em;
        margin-bottom: 2px;
      }
      .field input,
      .field select {
        width: 100%;
        border: 2px solid var(--ink);
        background: #ffffff;
        color: var(--ink);
        font: inherit;
        font-size: 11px;
        padding: 4px 6px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin: 8px 0;
      }
      .actions button {
        flex: 1;
        border: 2px solid var(--ink);
        background: var(--slate);
        color: var(--ink);
        font: inherit;
        font-size: 10px;
        letter-spacing: 0.08em;
        padding: 4px 0;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--ink);
      }
      .actions button:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      .row {
        font-size: 10px;
        letter-spacing: 0.06em;
        min-height: 12px;
        margin: 4px 0 0;
      }
      .row.error {
        color: #dc2626;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="bar" class="hidden"></div>
    <div id="keys" class="hidden">
      <section class="card">
        <h2 class="provider-name">ZAI (Zhipu AI)</h2>
        <label class="field">
          <span>PLATFORM</span>
          <select id="zai-platform">
            <option value="zai">Z.AI (api.z.ai)</option>
            <option value="zhipu">ZHIPU (open.bigmodel.cn)</option>
          </select>
        </label>
        <label class="field">
          <span>API TOKEN</span>
          <input id="zai-key" type="password" autocomplete="off" placeholder="Paste the monitor token" />
        </label>
        <p id="zai-masked" class="row"></p>
        <div class="actions">
          <button id="zai-save" type="button">SAVE</button>
          <button id="zai-revoke" type="button">REVOKE</button>
        </div>
      </section>
      <section class="card">
        <h2 class="provider-name">QWEN (Alibaba Cloud)</h2>
        <label class="field">
          <span>BSS SITE</span>
          <select id="qwen-site">
            <option value="international">International</option>
            <option value="china">China</option>
          </select>
        </label>
        <label class="field">
          <span>ACCESS KEY ID</span>
          <input id="qwen-akid" type="password" autocomplete="off" placeholder="AccessKeyId" />
        </label>
        <label class="field">
          <span>ACCESS KEY SECRET</span>
          <input id="qwen-aksecret" type="password" autocomplete="off" placeholder="AccessKeySecret" />
        </label>
        <p id="qwen-masked" class="row"></p>
        <div class="actions">
          <button id="qwen-save" type="button">SAVE</button>
          <button id="qwen-revoke" type="button">REVOKE</button>
        </div>
        <label class="field">
          <span>PLAN KEY (OPTIONAL sk-sp-)</span>
          <input id="qwen-plan-key" type="password" autocomplete="off" placeholder="sk-sp-…" />
        </label>
        <p id="qwen-plan-masked" class="row"></p>
        <div class="actions">
          <button id="qwen-plan-save" type="button">SAVE</button>
          <button id="qwen-plan-revoke" type="button">REVOKE</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
