[package]
name = "quotadeck-desktop"
version = "0.1.0"
description = "QuotaDeck desktop tray app - AI provider quota monitor without the browser"
edition = "2021"

[features]
# Embeds frontendDist assets so plain `cargo build` binaries load the bundled
# frontend instead of the tauri dev server (http://localhost:5173).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
tauri-plugin-single-instance = "2"
tauri-plugin-http = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
