[package]
name = "quotadeck-desktop"
version = "0.1.0"
description = "QuotaDeck desktop tray app - AI provider quota monitor without the browser"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
