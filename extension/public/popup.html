<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>quotadeck</title>
    <!--
      Static shell (AD-14): MV3 extension-page CSP (script-src 'self') forbids
      inline scripts and inline event-handler attributes, so ALL behavior lives
      in the bundled popup.js below; the inline <style> element is CSP-legal.
      Styles cover both popup views (AD-22): the consumption main view and the
      gear-driven settings view.
    -->
    <style>
      body {
        font: 13px system-ui, sans-serif;
        margin: 12px;
        min-width: 300px;
      }
      .popup-header {
        align-items: center;
        display: flex;
        justify-content: space-between;
        margin: 0 0 8px;
      }
      .popup-header h1 {
        font-size: 15px;
        margin: 0;
      }
      .header-action {
        background: none;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        padding: 2px 8px;
      }
      .provider {
        border-top: 1px solid #e0e0e0;
        padding: 8px 0 4px;
      }
      .provider-name {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .usage {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .refresh-error,
      .guidance {
        color: #c62828;
        margin: 0 0 4px;
      }
      .tier,
      .no-cycle,
      .key-state {
        color: #555;
        margin: 0 0 4px;
      }
      .monitor {
        border-left: 3px solid #e0e0e0;
        margin: 0 0 4px;
        padding-left: 8px;
      }
      .monitor-level {
        font-weight: 600;
        margin: 0 0 2px;
      }
      .monitor-window,
      .monitor-mcp {
        margin: 0 0 2px;
      }
      .mcp-tools {
        color: #555;
        list-style: none;
        margin: 0 0 2px;
        padding: 0;
      }
      .mcp-tool {
        margin: 0 0 2px;
      }
      .platform-field {
        align-items: center;
        display: flex;
        gap: 6px;
        margin: 4px 0;
      }
      .model-rows {
        color: #555;
        list-style: none;
        margin: 0 0 4px;
        padding: 0;
      }
      .model-row {
        margin: 0 0 2px;
      }
      .key-form {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 4px 0;
      }
      .key-form input {
        flex: 1;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="popup.js"></script>
  </body>
</html>
