<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>quotadeck</title>
    <!--
      Static shell (AD-14): MV3 extension-page CSP (script-src 'self') forbids
      inline scripts and inline event-handler attributes, so ALL behavior lives
      in the bundled popup.js below; the inline <style> element is CSP-legal
      (MV3 default CSP permits style elements and generated style attributes).
      Hito-11 restyle: the Neo-Brutalist Developer Instrument design system
      (docs/design/stitch/.../DESIGN.md) — warm paper #FDFDF7, ink #18181B 2px
      borders, 0px radius, hard unblurred 4px/2px offset shadows, pressed
      translate(4px,4px), uppercase mono chips, segmented threshold bars,
      fixed 360px canvas. Fonts are LOCAL OFL woff2 (public/fonts/, copied to
      dist/fonts/ by build.mjs) — zero remote references (MV3 CSP + offline
      honesty). Space Grotesk and JetBrains Mono are variable files served by
      Google Fonts' css2 API as one file per family covering the requested
      weight range, hence the `font-weight: 500 700` ranges below.
    -->
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 500 700;
        font-display: swap;
        src: url('fonts/space-grotesk-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 500 700;
        font-display: swap;
        src: url('fonts/jetbrains-mono-latin.woff2') format('woff2');
      }
      :root {
        --paper: #fdfdf7;
        --ink: #18181b;
        --yellow: #fde047;
        --cyan: #67e8f9;
        --green: #16a34a;
        --amber: #f59e0b;
        --red: #dc2626;
        --green-bg: #dcfce7;
        --amber-bg: #fef3c7;
        --red-bg: #fee2e2;
        --green-text: #166534;
        --amber-text: #b45309;
        --font-display: 'Space Grotesk', system-ui, 'Segoe UI', sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }
      * {
        border-radius: 0; /* DESIGN.md: rounding is forbidden */
        box-sizing: border-box;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font: 500 13px/1.25 var(--font-display);
        margin: 0;
        width: 360px;
      }
      #app {
        padding: 12px;
      }
      .icon {
        display: inline-block;
        flex: none;
        height: 16px;
        vertical-align: -3px;
        width: 16px;
      }
      /* ---- Header -------------------------------------------------------- */
      .popup-header {
        align-items: flex-start;
        display: flex;
        justify-content: space-between;
        margin: 0 0 12px;
      }
      .brand {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .popup-header h1 {
        font: 700 24px/1 var(--font-display);
        letter-spacing: -0.03em;
        margin: 0;
      }
      .header-actions {
        display: flex;
        gap: 8px;
      }
      .header-action {
        background: #ffffff;
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        color: var(--ink);
        cursor: pointer;
        display: inline-flex;
        padding: 6px;
      }
      .header-action:hover {
        background: var(--yellow);
      }
      .header-action:active {
        box-shadow: 0 0 0 var(--ink);
        transform: translate(4px, 4px);
      }
      /* ---- Chips (uppercase mono micro-tags) ------------------------------ */
      .chip {
        align-items: center;
        border: 2px solid var(--ink);
        display: inline-flex;
        font: 600 10px/12px var(--font-mono);
        gap: 4px;
        letter-spacing: 0.04em;
        padding: 2px 6px;
        text-transform: uppercase;
      }
      .chip .icon {
        height: 12px;
        width: 12px;
      }
      .chip-plan {
        background: var(--yellow);
        color: var(--ink);
      }
      .chip-known {
        background: #ffffff;
        color: var(--ink);
      }
      .chip-mcp {
        background: var(--cyan);
        color: var(--ink);
        font-size: 9px;
        padding: 1px 4px;
      }
      /* Badge-ownership marker (hito-12 WU-M2): existing chip vocabulary,
         existing cyan token — no new colors. */
      .chip-badge {
        background: var(--cyan);
        color: var(--ink);
      }
      /* ---- Cards ----------------------------------------------------------- */
      .card {
        background: #ffffff;
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        margin: 0 0 20px;
        padding: 12px;
      }
      .provider-name {
        border-bottom: 2px solid var(--ink);
        font: 700 15px/18px var(--font-display);
        letter-spacing: -0.01em;
        margin: 0 0 8px;
        padding: 0 0 4px;
        text-transform: uppercase;
      }
      .hero-percentage {
        font: 700 44px/1 var(--font-mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .hero-percentage.band-green {
        color: var(--green);
      }
      .hero-percentage.band-amber {
        color: var(--amber);
      }
      .hero-percentage.band-red {
        color: var(--red);
      }
      /* Click-to-choose hero (hito-12 WU-M2): the whole row is the touch
         target — pointer affordance, neo-brutal ink shift on hover. */
      .hero-pick {
        align-items: baseline;
        cursor: pointer;
        display: flex;
        gap: 8px;
      }
      .hero-pick:hover .hero-percentage {
        color: var(--ink);
      }
      .hero-pick:active .hero-percentage {
        transform: translate(2px, 2px);
      }
      .usage {
        font: 700 20px/22px var(--font-mono);
        font-variant-numeric: tabular-nums;
        margin: 0 0 6px;
      }
      .refresh-error {
        background: var(--red);
        border: 2px solid var(--ink);
        color: #ffffff;
        font: 700 18px/22px var(--font-display);
        letter-spacing: -0.02em;
        margin: 0 0 6px;
        padding: 4px 8px;
        text-transform: uppercase;
      }
      .card-error {
        border-color: var(--ink);
      }
      .guidance {
        background: var(--amber-bg);
        border: 2px solid var(--ink);
        color: var(--amber-text);
        font: 500 12px/16px var(--font-display);
        margin: 0 0 6px;
        padding: 6px 8px;
      }
      .settings-guidance {
        border: 2px dashed var(--ink);
        color: #47464b;
        font: 500 11px/14px var(--font-display);
        margin: 0 0 8px;
        padding: 6px 8px;
      }
      .tier,
      .no-cycle,
      .key-state,
      .plan-status {
        color: #47464b;
        font: 600 11px/14px var(--font-mono);
        margin: 0 0 4px;
      }
      /* hito-12 WU-M: the quota card is the ZAI monitor's visual twin — it
         reuses .monitor, .monitor-window and .bar verbatim, so no quota-
         specific rule exists. */
      .key-state {
        background: var(--paper);
        border: 2px solid var(--ink);
        padding: 3px 6px;
      }
      /* ---- LAST KNOWN (frozen) block -------------------------------------- */
      .last-known {
        border: 2px dashed var(--ink);
        margin: 8px 0 0;
        opacity: 0.6;
        padding: 8px;
      }
      .last-known > .chip {
        margin: 0 0 6px;
      }
      /* ---- Monitor block --------------------------------------------------- */
      .monitor {
        border: 2px solid var(--ink);
        box-shadow: 2px 2px 0 var(--ink);
        margin: 4px 0 8px;
        padding: 8px;
      }
      .monitor-level {
        font: 600 11px/14px var(--font-mono);
        letter-spacing: 0.02em;
        margin: 0 0 6px;
        text-transform: uppercase;
      }
      .monitor-window,
      .monitor-mcp {
        align-items: baseline;
        display: flex;
        font: 500 11px/14px var(--font-mono);
        gap: 4px;
        letter-spacing: 0.02em;
        margin: 0 0 2px;
      }
      .countdown {
        background: var(--yellow);
        border: 2px solid var(--ink);
        color: var(--ink);
        font-weight: 700;
        padding: 0 4px;
        text-transform: uppercase;
      }
      /* ---- Segmented threshold bars ---------------------------------------- */
      .bar {
        background: #ffffff;
        border: 2px solid var(--ink);
        height: 18px;
        margin: 2px 0 8px;
        position: relative;
      }
      .bar-fill {
        height: 100%;
      }
      .band-green .bar-fill {
        background: var(--green);
      }
      .band-amber .bar-fill {
        background: var(--amber);
      }
      .band-red .bar-fill {
        background: var(--red);
      }
      /* Notch lines at 25 / 50 / 75 / 90 % — hard ink stops, zero blur. */
      .bar-ticks {
        background-image: linear-gradient(
          to right,
          transparent 0 calc(25% - 2px),
          var(--ink) calc(25% - 2px) 25%,
          transparent 25% calc(50% - 2px),
          var(--ink) calc(50% - 2px) 50%,
          transparent 50% calc(75% - 2px),
          var(--ink) calc(75% - 2px) 75%,
          transparent 75% calc(90% - 2px),
          var(--ink) calc(90% - 2px) 90%,
          transparent 90% 100%
        );
        inset: 0;
        pointer-events: none;
        position: absolute;
      }
      .bar-pct {
        color: #ffffff;
        font: 700 11px/1 var(--font-mono);
        padding: 0 4px;
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
      }
      .mcp-tools,
      .model-rows {
        list-style: none;
        margin: 2px 0 0;
        padding: 0;
      }
      .mcp-tool,
      .model-row {
        border-top: 2px dashed var(--ink);
        font: 500 11px/14px var(--font-mono);
        margin: 0;
        padding: 3px 0 3px 12px;
        position: relative;
      }
      .mcp-tool::before,
      .model-row::before {
        background: var(--ink);
        content: '';
        display: block;
        height: 6px;
        left: 2px;
        position: absolute;
        top: 7px;
        width: 6px;
      }
      /* ---- Settings forms -------------------------------------------------- */
      .key-form {
        border: 2px solid var(--ink);
        box-shadow: 2px 2px 0 var(--ink);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
        padding: 8px;
      }
      .key-form label {
        font: 600 10px/12px var(--font-mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        width: 100%;
      }
      .key-form input,
      .platform-field select,
      .site-field select,
      .badge-provider-field select {
        background: #ffffff;
        border: 2px solid var(--ink);
        color: var(--ink);
        font: 500 12px/16px var(--font-mono);
        padding: 5px 8px;
      }
      .key-form input {
        flex: 1;
        min-width: 0;
      }
      .key-form input:focus,
      .platform-field select:focus,
      .site-field select:focus,
      .badge-provider-field select:focus {
        box-shadow: 2px 2px 0 var(--ink);
        outline: none;
      }
      .key-form input::placeholder {
        color: #71717a;
      }
      /* Stacked qwen credential fields (hito-12 WU-K squeeze fix, restated
         in the hito-11 key-form vocabulary): each .credential-field owns a
         full flex line — the shared .key-form label rule styles the label
         above its own full-width input — and .form-actions puts the
         save/revoke controls on their own line. Single-field forms
         (zai/openai/kimi) render no wrappers and keep the compact row. */
      .credential-field {
        display: flex;
        flex: 1 1 100%;
        flex-direction: column;
        gap: 2px;
      }
      .credential-field input {
        flex: none;
        width: 100%;
      }
      .form-actions {
        display: flex;
        flex: 1 1 100%;
        gap: 6px;
      }
      .key-form button {
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        cursor: pointer;
        font: 600 11px/14px var(--font-mono);
        letter-spacing: 0.02em;
        padding: 6px 12px;
        text-transform: uppercase;
      }
      .key-form button[type='submit'] {
        background: var(--yellow);
        color: var(--ink);
      }
      .key-form button.revoke {
        background: var(--red);
        color: #ffffff;
      }
      .key-form button:active {
        box-shadow: 0 0 0 var(--ink);
        transform: translate(4px, 4px);
      }
      /* hito-12's badge-provider selector joins the design's select-row
         vocabulary (same treatment as the platform/site fields); its own
         margin states it as the view-opening row outside any card. */
      .platform-field,
      .site-field,
      .badge-provider-field {
        align-items: center;
        display: flex;
        gap: 8px;
        margin: 6px 0 2px;
      }
      .badge-provider-field {
        margin: 0 0 12px;
      }
      .platform-field label,
      .site-field label,
      .badge-provider-field label {
        font: 600 10px/12px var(--font-mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      /* ---- Footer nav (exactly QUOTAS + KEYS) ------------------------------ */
      .tabbar {
        display: flex;
        gap: 8px;
        margin: 0 0 12px;
      }
      .tab {
        align-items: center;
        background: #ffffff;
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        color: var(--ink);
        cursor: pointer;
        display: inline-flex;
        flex: 1;
        font: 600 11px/14px var(--font-mono);
        gap: 6px;
        justify-content: center;
        letter-spacing: 0.02em;
        padding: 8px 4px;
        text-transform: uppercase;
      }
      .tab-active {
        background: var(--yellow);
        cursor: default;
      }
      .tab:not(.tab-active):active {
        box-shadow: 0 0 0 var(--ink);
        transform: translate(4px, 4px);
      }
      /* ---- Branding footer -------------------------------------------------- */
      .popup-footer {
        border: 2px solid var(--ink);
        color: #47464b;
        font: 500 10px/14px var(--font-mono);
        letter-spacing: 0.04em;
        margin: 0;
        padding: 6px 8px;
        text-align: center;
        text-transform: uppercase;
      }
      .popup-footer a {
        color: var(--ink);
        font-weight: 700;
      }
      .popup-footer .version {
        color: var(--ink);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="popup.js"></script>
  </body>
</html>
