# openspec/config.yaml
# SDD bootstrap for quotadeck — generated by sdd-init on 2026-09-05; refreshed same day after extension/ scaffolding.
schema: spec-driven

context: |
  Tech stack: TypeScript 7.0.2 Chrome extension (MV3) in extension/, bundled with esbuild 0.28.
  Architecture: single project extension/ (background service, src/); hermetic node-environment unit suite (src/**/*.test.ts).
  Testing: vitest 5.0.0 — 13 files / 74 tests green via `npm --prefix extension run test` from the workspace root.
  Style: type checking via `tsc --noEmit`; no linter or formatter configured yet.

strict_tdd: true # single in-scope project (extension/); `npm --prefix extension run test` runs the complete in-scope set from the workspace root

testing:
  detected: 2026-09-05
  workspace_root: C:/Users/Javier/IdeaProjects/github/quotadeck
  scan: >-
    Bounded discovery at workspace root and up to two directory levels below.
    Markers checked: package.json, go.mod, pyproject.toml, Cargo.toml,
    pnpm-workspace.yaml, Makefile, pytest.ini. Excluded: .git, node_modules,
    vendor, dist, build, out, target, .cache, __pycache__, .venv, venv.
  projects:
    - path: extension
      stack: TypeScript 7.0.2, esbuild 0.28, @types/chrome (Chrome extension MV3)
      test_command: npm --prefix extension run test
      framework: vitest
      layers: [unit]
      coverage: null # no @vitest/coverage-v8 dependency or coverage script
      typecheck: npm --prefix extension run typecheck # tsc --noEmit
      build: npm --prefix extension run build # esbuild via build.mjs -> dist/
      linter: null
      formatter: null
  workspace_test_command: npm --prefix extension run test # covers every in-scope project (1 of 1); re-evaluate if new projects appear

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: "npm --prefix extension run test"
  verify:
    test_command: "npm --prefix extension run test"
    build_command: "npm --prefix extension run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
